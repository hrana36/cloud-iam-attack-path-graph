[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-iam-attack-path-graph"
version = "1.0.0"
description = "Multi-Cloud Graph-Theoretic Privilege Escalation and Lateral Movement Pathfinding Engine"
authors = [{ name = "Md Habibur Rahaman Rana", email = "hrana36@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
